name: test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check build.zig src

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check build.zig src

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Build macOS targets
        run: |
          zig build -Dtarget=aarch64-macos
          zig build -Dtarget=x86_64-macos
          zig build -Dmacos-universal
