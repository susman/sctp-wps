name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-zig-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Create package tarball
        id: tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="${RUNNER_TEMP}/sctp-wps-${tag}.tar.gz"
          tar --exclude=.git \
            --exclude=.github \
            --exclude=.gitignore \
            --exclude=.gitmodules \
            --exclude=examples \
            --exclude=AGENTS.md \
            --exclude=package.sh \
            -czf "${archive}" -C "${GITHUB_WORKSPACE}" .
          files="$(tar -tzf "${archive}" | sed 's|^./||')"
          for expected in \
              usrsctp/usrsctplib/netinet/sctp_os_userspace.h \
              wavpack-stream/src/pack_utils.c
          do
              printf '%s\n' "$files" | grep -qx "${expected}" || {
                  echo "error: ${archive} is missing ${expected}" >&2
                  exit 1
              }
          done
          echo "path=${archive}" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        run: |
          curl -fsSLo /tmp/zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo /tmp/zig >> "${GITHUB_PATH}"

      - name: Validate package
        run: zig fetch "${{ steps.tarball.outputs.path }}" > /dev/null

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "${tag}" --verify-tag --generate-notes \
            "${{ steps.tarball.outputs.path }}" \
          || gh release upload "${tag}" "${{ steps.tarball.outputs.path }}" --clobber
